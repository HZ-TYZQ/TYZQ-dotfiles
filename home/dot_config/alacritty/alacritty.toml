[general]
working_directory = "None"
live_config_reload = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 100, lines = 30 }
# Kitty window_padding_width = 12 pt, equivalent to 16 px at 96 DPI.
padding = { x = 16, y = 16 }
dynamic_padding = true
decorations = "Full"
opacity = 1.0
title = "Alacritty@CachyOS"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular" }
# Match the SemiBold faces selected by Kitty's automatic bold font lookup.
bold = { family = "CaskaydiaCove Nerd Font Mono", style = "SemiBold" }
italic = { family = "CaskaydiaCove Nerd Font Mono", style = "Italic" }
bold_italic = { family = "CaskaydiaCove Nerd Font Mono", style = "SemiBold Italic" }
size = 12.0

[colors]
# Oolong Dark, synced from Kitty with its background override.
draw_bold_text_with_bright_colors = false

[colors.cursor]
text = "#1e1b16"
cursor = "#e9ce94"

[colors.selection]
text = "CellForeground"
background = "#2f3d32"

[colors.primary]
background = "#242321"
foreground = "#dad2c1"

[colors.normal]
black = "#343028"
red = "#d59087"
green = "#9bbd8a"
yellow = "#d7ba7d"
blue = "#83b2ce"
magenta = "#c697b6"
cyan = "#81bfb6"
white = "#c1baab"

[colors.bright]
black = "#8d877a"
red = "#eca69c"
green = "#b1d49f"
yellow = "#e9ce94"
blue = "#98c8e5"
magenta = "#ddadcc"
cyan = "#97d6cd"
white = "#eee7d9"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 1000
blink_timeout = 15
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true
bindings = [{ mouse = "Middle", mods = "None", action = "PasteSelection" }]

[keyboard]
bindings = [
  { key = "Paste", mods = "None", action = "Paste" },
  { key = "Copy", mods = "None", action = "Copy" },
  { key = "L", mods = "Control", action = "ClearLogNotice" },
  { key = "L", mods = "Control", mode = "~Vi", chars = "\f" },
  { key = "PageUp", mods = "Shift", mode = "~Alt", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", mode = "~Alt", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
  { key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },
  { key = "C", mods = "Control|Shift", mode = "Vi", action = "ClearSelection" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
