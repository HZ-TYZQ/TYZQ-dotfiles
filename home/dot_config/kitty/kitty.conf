# Kitty 主配置

# ── 主题：One Half Dark ───────────────────────────────
include themes/One Half Dark.conf

# ── 字体 ─────────────────────────────────────────────
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12

# ── 光标 ─────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 1
# 拖尾动画：数值是时长（毫秒），0 关闭；3 左右最明显又不晃眼
cursor_trail 10

# ── 窗口 ─────────────────────────────────────────────
window_padding_width 12
#hide_window_decorations yes
# 仅让终端背景略微透明；文字与 Fcitx5 候选框保持完整不透明。
# 背景模糊由 niri 针对 kitty 的 window-rule 提供。
background_opacity 1.00
background_blur 0
dynamic_background_opacity yes
confirm_os_window_close 0

# ── 鼠标 ─────────────────────────────────────────────
# 缩短双击/三击判定窗口：单击移动光标的延迟从 ~0.5s 降到 0.2s
# 代价：双击选词需要点得更快（0.2s 内）
click_interval 0.2

# ── 滚动缓冲 ─────────────────────────────────────────
scrollback_lines 10000


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME